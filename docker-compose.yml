services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: risk-backend
    volumes:
      - ./backend/data:/data
    env_file:
      - backend/.env.example
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: risk-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
