services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: risk-backend
    volumes:
      - ./backend/data:/app/backend/data
    env_file:
      - backend/.env.example
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: risk-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
