name: CD Release Artifacts

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define image metadata
        id: meta
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${GITHUB_REPOSITORY##*/}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "owner=$OWNER" >> $GITHUB_OUTPUT
          echo "repo=$REPO" >> $GITHUB_OUTPUT
          echo "tag=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        run: |
          docker buildx build \
            --push \
            -t ghcr.io/${{ steps.meta.outputs.owner }}/${{ steps.meta.outputs.repo }}-backend:${{ steps.meta.outputs.tag }} \
            ./backend

      - name: Build and push frontend image
        run: |
          docker buildx build \
            --push \
            -t ghcr.io/${{ steps.meta.outputs.owner }}/${{ steps.meta.outputs.repo }}-frontend:${{ steps.meta.outputs.tag }} \
            ./frontend
